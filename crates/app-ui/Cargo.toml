[package]
name = "kick-gpui-poc"
version = "0.2.1"
edition = "2024"
publish = false

[dependencies]
kick-core = { path = "../kick-core" }
kick-live = { path = "../kick-live", features = ["realtime"] }
kick-player-macos = { path = "../player-macos" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "82f2558e17f6459f2cc8cb4a9fbe05e36520cdd9", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "82f2558e17f6459f2cc8cb4a9fbe05e36520cdd9", default-features = false, features = ["font-kit"] }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "82f2558e17f6459f2cc8cb4a9fbe05e36520cdd9" }
rustls = "0.23"
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "objc2-core-foundation"] }
raw-window-handle = "0.6.2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
