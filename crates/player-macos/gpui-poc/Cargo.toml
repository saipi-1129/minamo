[workspace]
resolver = "3"

[package]
name = "kick-player-gpui-poc"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
kick-player-macos = { path = ".." }
gpui = { git = "https://github.com/zed-industries/zed", rev = "82f2558e17f6459f2cc8cb4a9fbe05e36520cdd9", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "82f2558e17f6459f2cc8cb4a9fbe05e36520cdd9", default-features = false, features = ["font-kit"] }
raw-window-handle = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "objc2-core-foundation"] }
