[package]
name = "kick-live"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
default = []
realtime = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
cli = ["realtime"]

[dependencies]
tokio-tungstenite = { version = "0.30", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
kick-core = { path = "../kick-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "sync", "io-util"], optional = true }

[[bin]]
name = "kick-live"
path = "src/main.rs"
required-features = ["cli"]
